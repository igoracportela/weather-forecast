name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: RuboCop
        run: bin/rubocop -f github
      - name: Brakeman
        run: bin/brakeman --quiet --no-pager --exit-on-warn --exit-on-error
      - name: Bundler audit
        run: bin/bundler-audit

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The suite runs on both cache backends.
        cache: [memory, redis]
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5
    env:
      RAILS_ENV: test
      REDIS_URL: ${{ matrix.cache == 'redis' && 'redis://localhost:6379/1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: RSpec (${{ matrix.cache }} cache, coverage gate 95%)
        run: bin/rspec
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.cache }}
          path: coverage/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t weather_forecast:ci .
      - name: Boot with Redis and hit /up and a lookup page
        run: |
          docker compose up -d --build --wait
          curl -fsS http://localhost:3000/up
          curl -fsS http://localhost:3000/ | grep -q 'name="address"'
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
